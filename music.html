<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>八音盒 · 拾窗</title>
<meta name="description" content="八音盒——su 和 ee 收藏的音乐，上好发条慢慢听。">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/page.css">
<link rel="stylesheet" href="assets/css/music.css">
<link rel="stylesheet" href="assets/css/interact.css">
</head>
<body>

<header class="page-bar">
  <a class="back-home" href="index.html">☙ 返回屋顶</a>
  <span class="crumb">路过音乐角</span>
  <span class="room-name">八音盒</span>
</header>

<main class="page-main">

  <figure class="win-frame">
    <img src="assets/img/music.png" alt="八音盒——唱片机与音乐盒安静的角落">
    <figcaption>music · 上好发条，让旋律替我们说话</figcaption>
  </figure>

  <div class="room-head">
    <h1>八音盒</h1>
    <p class="sub">ROOM 05 · <b>收藏音乐</b> · 每一首都想寄给你</p>
  </div>

  <!-- 唱机 -->
  <section class="gramo">
    <div class="disc" id="disc">
      <div class="disc-face"></div>
      <div class="disc-label"></div>
      <i class="disc-shine"></i>
    </div>
    <div class="tonearm" id="tonearm"><i></i></div>
    <p class="gramo-tip" id="gramoTip">把唱片放上去（点击任意一首）</p>
  </section>

  <!-- 曲目列表：像一叠唱片套 -->
  <section class="sleeves" id="sleeves"></section>

  <p class="music-note">—— 附一首歌的理由，比歌单更私密 ——</p>

</main>

<button class="night-toggle" title="夜灯">☽</button>
<a class="to-roof" href="index.html">← 返回屋顶</a>
