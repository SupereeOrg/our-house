<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>拾遗集 · 拾窗</title>
<meta name="description" content="拾遗集——su 和 ee 的其他作品，路上捡到的宝贝。">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/page.css">
<link rel="stylesheet" href="assets/css/misc.css">
<link rel="stylesheet" href="assets/css/interact.css">
</head>
<body>

<header class="page-bar">
  <a class="back-home" href="index.html">☙ 返回屋顶</a>
  <span class="crumb">路过书桌</span>
  <span class="room-name">拾遗集</span>
</header>

<main class="page-main">

  <figure class="win-frame">
    <img src="assets/img/misc.png" alt="拾遗集——桌上的钢笔、素描本与旧相机">
    <figcaption>misc · 路上捡到的宝贝，都放在这张桌子上</figcaption>
  </figure>

  <div class="room-head">
    <h1>拾遗集</h1>
    <p class="sub">ROOM 04 · <b>其他作品</b> · 弯腰捡起来的闪光</p>
  </div>

  <!-- 桌面藏品：错落摆放 -->
  <section class="desk">
    <article class="relic r-1">
      <div class="relic-frame">
        <svg viewBox="0 0 48 48" width="44" height="44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 36 L16 12 h4 l4 24 M14.5 28 h7"/>
          <path d="M30 12 v24 M26 12 h8 M26 36 h8"/>
        </svg>
      </div>
      <h3>字与画</h3>
      <p>在儿童磁吸手写板上写的字、发出去就后悔的深夜消息、认真收集的表情包。它们不太「有用」，但很「有心」。</p>
      <span class="relic-note">共 13 件 · 持续扩充中</span>
    </article>

    <article class="relic r-2">
      <div class="relic-frame">
        <svg viewBox="0 0 48 48" width="44" height="44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="14" width="36" height="26" rx="3"/>
          <path d="M16 14 L19 8 h10 l3 6"/>
          <circle cx="24" cy="27" r="7"/>
          <circle cx="36" cy="20" r="1.4" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <h3>取景框</h3>
      <p>不爱拍照的人拍下的光影：拉萨晚上十点的天、三点整说好的那张照、来不及命名的黄昏。</p>
      <span class="relic-note">共 2 张 · 三点再说</span>
    </article>

    <article class="relic r-3">
      <div class="relic-frame">
        <svg viewBox="0 0 48 48" width="44" height="44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 40 L24 8 L40 40 Z"/>
          <path d="M24 8 v32 M15 24 h18" opacity=".5"/>
        </svg>
      </div>
      <h3>小实验</h3>
      <p>一版 eebot、一道芝士披萨、一局原神。人生很难，但玩很重要。</p>
      <span class="relic-note">共 29 次 · 工作文件夹里</span>
    </article>
  </section>

  <p class="desk-note">—— 桌子还空着很多位置，是在等更多散步的理由 ——</p>

</main>

<button class="night-toggle" title="夜灯">☽</button>
<a class="to-roof" href="index.html">← 返回屋顶</a>
<script src="assets/js/common.js"></script>
<script src="assets/js/interact.js"></script>
</body>
</html>
