<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>明信片墙 · 拾窗</title>
<meta name="description" content="明信片墙——su 和 ee 收藏的图片，钉在细绳上的风景。">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/page.css">
<link rel="stylesheet" href="assets/css/gallery.css">
<link rel="stylesheet" href="assets/css/interact.css">
</head>
<body>

<header class="page-bar">
  <a class="back-home" href="index.html">☙ 返回屋顶</a>
  <span class="crumb">路过画廊</span>
  <span class="room-name">明信片墙</span>
</header>

<main class="page-main">

  <figure class="win-frame">
    <img src="assets/img/gallery.png" alt="明信片墙——挂满相框的走廊">
    <figcaption>gallery · 每一张都盖着当天的邮戳</figcaption>
  </figure>

  <div class="room-head">
    <h1>明信片墙</h1>
    <p class="sub">ROOM 06 · <b>收藏图片</b> · 钉在细绳上的风景</p>
  </div>

  <!-- 灯与光锥 -->
  <div class="gallery-lamp" aria-hidden="true"></div>

  <!-- 挂绳 -->
  <section class="ropes">
    <div class="rope" data-rope="1">
      <figure class="card c-1">
        <img src="assets/img/cat.png" alt="窗台上打盹的猫">
        <figcaption>「午后三点再拍」 · su 藏</figcaption>
      </figure>
      <figure class="card c-2">
        <img src="assets/img/divider.png" alt="低低的天和云">
        <figcaption>「云雾缭绕」 · su 藏</figcaption>
      </figure>
      <figure class="card c-3">
        <img src="assets/img/stars.png" alt="疑似星星的夜空">
        <figcaption>「疑似看到了星星」 · su 藏</figcaption>
      </figure>
    </div>
    <div class="rope" data-rope="2">
      <figure class="card c-4">
        <img src="assets/img/index.png" alt="屋顶俯瞰的小屋">
        <figcaption>「我们的屋顶」 · ee 藏</figcaption>
      </figure>
      <figure class="card c-5">
        <img src="assets/img/letterbox.png" alt="草地上的邮筒">
        <figcaption>「想邮的东西越来越多」 · su 藏</figcaption>
      </figure>
    </div>
  </section>

  <p class="gallery-note">—— 新的明信片会继续挂上来，旧的不摘 ——</p>

</main>

<button class="night-toggle" title="夜灯">☽</button>
<a class="to-roof" href="index.html">← 返回屋顶</a>
<script src="assets/js/common.js"></script>
<script src="assets/js/interact.js"></script>
</body>
</html>
